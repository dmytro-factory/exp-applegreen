<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>05 Map</title>
<link rel="stylesheet" href="tokens.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  .map-wrap { position: relative; flex: 1; overflow: hidden; }
  .map-base {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 30% 35%, #d9ead1 0 60px, transparent 61px),
      linear-gradient(115deg, #c7e3bd 0%, #d7ead0 45%, #cfe6e3 100%);
  }
  .map-base::before {
    content: ""; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(35deg, rgba(255,255,255,0.5) 0 2px, transparent 2px 70px),
      repeating-linear-gradient(125deg, rgba(255,255,255,0.4) 0 2px, transparent 2px 90px);
  }
  .road { position: absolute; background: #f2f4ee; }
  .road.r1 { width: 6px; height: 130%; top: -10%; left: 40%; transform: rotate(18deg); }
  .road.r2 { width: 4px; height: 130%; top: -10%; left: 62%; transform: rotate(-22deg); }
  .pin {
    position: absolute; top: 46%; left: 47%; transform: translate(-50%, -50%);
    width: 30px; height: 30px; border-radius: 999px;
    background: var(--primary); border: 4px solid rgba(0,101,81,0.3);
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .chips-row { position: absolute; top: 0; left: 0; right: 0; z-index: 3; }
  .fabs { position: absolute; right: 16px; bottom: 220px; display: flex; flex-direction: column; gap: 12px; z-index: 3; }
  .fab {
    width: 52px; height: 52px; border-radius: 999px; background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-fab);
  }
  .help-fab { position: absolute; top: 66px; right: 16px; width: 40px; height: 40px; border-radius: 999px; background: #fff; color: var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-card); z-index: 3; }
  .sheet {
    position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 4;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar on-teal">
    <span>9:41</span>
    <span class="sb-right">
      <i data-lucide="signal" class="i-18"></i>
      <i data-lucide="wifi" class="i-18"></i>
      <i data-lucide="battery-full" class="i-24"></i>
    </span>
  </div>

  <div class="appbar">
    <div class="wordmark">
      <svg class="leaf" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="17.5" r="13" fill="#62a60e" />
        <path d="M15 4c.5 5.5 3 9.5 8 11.5C21.5 9.5 19 5.5 15 4z" fill="#fff" />
        <path d="M15 4c-3 1.5-5 4-5 7 0 4.5 3.5 8 9 8.5C16 14 14.5 9 15 4z" fill="#cdeaa6" />
      </svg>
      <span class="name"><b>applegreen</b> <span>fast charge</span></span>
    </div>
    <span class="icon-btn"><i data-lucide="search" class="i-24"></i></span>
  </div>

  <div class="map-wrap">
    <div class="map-base"></div>
    <div class="road r1"></div>
    <div class="road r2"></div>
    <div class="pin"></div>

    <div class="chips-row">
      <div class="chips">
        <span class="chip icon-only"><i data-lucide="sliders-horizontal" class="i-20"></i></span>
        <span class="chip">Connector type <i data-lucide="chevron-down" class="i-18"></i></span>
        <span class="chip">Charger speed <i data-lucide="chevron-down" class="i-18"></i></span>
        <span class="chip"><span class="dot"></span> Available</span>
      </div>
    </div>

    <div class="help-fab"><i data-lucide="help-circle" class="i-22"></i></div>
    <div class="fabs">
      <div class="fab"><i data-lucide="list" class="i-24"></i></div>
      <div class="fab"><i data-lucide="locate-fixed" class="i-24"></i></div>
    </div>

    <div class="sheet">
      <div class="card station-card">
        <div class="dist">287<sup>Ft</sup></div>
        <div class="title-row"><i data-lucide="building-2" class="i-18"></i><h3>Newport Pagnell North</h3></div>
        <p class="addr">Welcome Break Newport Pagnell (Milton Keynes) M1, Newport Pagnell, Buckinghamshire, United Kingdom</p>
        <div class="avail"><i data-lucide="plug-zap" class="i-20"></i> 16/16</div>
        <div class="card-actions" style="justify-content:center">
          <span class="pill"><i data-lucide="navigation" class="i-18"></i> Navigate</span>
          <span class="pill"><i data-lucide="heart" class="i-18"></i> Favourite</span>
        </div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab active"><i data-lucide="map" class="i-24"></i>Map</div>
    <div class="tab"><i data-lucide="list" class="i-24"></i>List</div>
    <div class="tab"><i data-lucide="gift" class="i-24"></i>Rewards</div>
    <div class="tab"><span class="avatar">FL</span>Profile</div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
