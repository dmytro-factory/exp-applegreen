<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>01 Splash</title>
<link rel="stylesheet" href="tokens.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  .splash {
    flex: 1;
    background:
      radial-gradient(120% 80% at 50% 12%, rgba(98, 166, 14, 0.35), transparent 60%),
      linear-gradient(180deg, #013b2e 0%, #006551 55%, #013b2e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    position: relative;
    overflow: hidden;
  }
  /* abstract motorway bridge silhouette */
  .splash .bridge {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 220px;
    background:
      linear-gradient(180deg, transparent, rgba(1, 30, 23, 0.85)),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 46px);
    clip-path: polygon(0 60%, 18% 40%, 38% 52%, 60% 34%, 82% 48%, 100% 38%, 100% 100%, 0 100%);
    opacity: 0.5;
  }
  .splash .leaf-big {
    width: 86px;
    height: 86px;
  }
  .splash .wordmark {
    color: #fff;
    font-size: 30px;
    letter-spacing: -0.5px;
    text-align: center;
  }
  .splash .wordmark b { font-weight: 700; }
  .splash .wordmark span { font-weight: 300; opacity: 0.95; }
  .splash .tagline {
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar on-teal">
    <span>9:41</span>
    <span class="sb-right">
      <i data-lucide="signal" class="i-18"></i>
      <i data-lucide="wifi" class="i-18"></i>
      <i data-lucide="battery-full" class="i-24"></i>
    </span>
  </div>
  <div class="splash">
    <div class="bridge"></div>
    <svg class="leaf-big" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="17.5" r="13" fill="#62a60e" />
      <path d="M15 4c.5 5.5 3 9.5 8 11.5C21.5 9.5 19 5.5 15 4z" fill="#fff" />
      <path d="M15 4c-3 1.5-5 4-5 7 0 4.5 3.5 8 9 8.5C16 14 14.5 9 15 4z" fill="#eaffd6" />
    </svg>
    <div class="wordmark"><b>applegreen</b> <span>fast charge</span></div>
    <div class="tagline">Applegreen Electric</div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
